<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3340">
<title>HALO: Flashpoint — Match Tracker</title>
<style>
:root{
  --navy:#2b3340; --navy-deep:#202733; --paper:#f4f5f7; --white:#fff;
  --ink:#20242b; --muted:#69717d; --line:#d9dde3;
  --red:#762f36; --red-light:#f4e9ea; --blue:#24577d; --blue-light:#e8f0f6;
  --accent:#7da8d6; --gold:#c5a35b; --radius:13px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.site-header{background:#fff;padding:13px 20px 10px;text-align:center}
.unofficial-label{font-size:clamp(11px,1.5vw,14px);font-weight:700;letter-spacing:.12em;
  color:#596270;text-transform:uppercase;margin:0 auto 9px}
.logo-wrap{display:flex;justify-content:center;margin:0 auto;padding:0}
.logo{width:min(390px,75vw);height:auto;max-height:135px;object-fit:contain}
.titlebar{background:var(--navy);color:#fff;text-align:center;padding:14px 16px 13px;
  border-top:4px solid #1c2430;border-bottom:4px solid #1c2430;
  font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(16px,2.2vw,21px);
  font-weight:700;letter-spacing:.2em}
main{width:min(1120px,calc(100% - 32px));margin:26px auto 52px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 14px #2027330b}
.matchbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:16px 20px;margin-bottom:17px}
.round-control{text-align:center;min-width:130px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--muted)}
.round-number{font-size:35px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;margin:3px 0 7px}
.stepper{display:flex;gap:7px;justify-content:center}
.stepper button,.score-stepper button{border:1px solid var(--line);background:#f7f8fa;color:var(--ink);border-radius:7px;width:35px;height:31px;font-size:19px;cursor:pointer}
.stepper button:hover,.score-stepper button:hover{background:#e9edf2}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.team{overflow:hidden;color:#fff;border-radius:var(--radius);box-shadow:0 4px 14px #20273318}
.team.red{background:var(--red)} .team.blue{background:var(--blue)}
.team-head{padding:15px 18px 8px;display:flex;justify-content:space-between;align-items:center}
.team-name{font-family:Impact,"Arial Narrow",sans-serif;font-size:23px;letter-spacing:.12em}
.team-tag{font-size:9px;letter-spacing:.16em;opacity:.75}
.score-area{display:flex;justify-content:center;align-items:baseline;gap:9px;padding:0 15px 4px}
.score{font-size:clamp(54px,8vw,76px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.vp{font-size:12px;letter-spacing:.2em;font-weight:800;opacity:.85}
.score-stepper{display:flex;justify-content:center;gap:9px;padding:9px 16px 16px}
.score-stepper button{background:#ffffff18;border-color:#ffffff55;color:#fff;width:43px;height:34px;font-size:21px}
.score-stepper button:hover{background:#ffffff32}
.team-foot{display:flex;justify-content:space-between;padding:10px 17px;background:#00000018;font-size:11px;letter-spacing:.04em}
.team-foot strong{font-variant-numeric:tabular-nums}
.reset-area{display:flex;justify-content:center;margin:22px 0 8px}
.reset{background:var(--red);border:1px solid #64252c;color:#fff;border-radius:7px;padding:12px 26px;
  font-size:11px;font-weight:800;letter-spacing:.14em;cursor:pointer;box-shadow:0 3px 8px #762f3626}
.reset:hover{background:#64252c}
.reset:focus-visible{outline:3px solid #d99da2;outline-offset:3px}
.section-heading{text-align:center;margin:0 0 5px;font-family:Impact,"Arial Narrow",sans-serif;font-size:26px;letter-spacing:.12em;color:var(--navy)}
.section-note{text-align:center;color:var(--muted);font-size:12px;margin:0 0 17px}
.tier{margin:14px 0 0;overflow:hidden}
.tier-title{background:var(--navy);color:#fff;text-align:center;padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.2em}
.tier-title span{color:#c5d4e5;font-weight:500;letter-spacing:.12em;margin-left:8px}
.team-labels{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;background:#eef1f4;padding:8px 13px;border-bottom:1px solid var(--line);font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--muted);text-align:center}
.team-labels .r{color:var(--red)} .team-labels .b{color:var(--blue)}
.achievement{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:8px;padding:12px 13px;border-bottom:1px solid #e9ecf0;min-height:66px}
.achievement:last-child{border-bottom:0}
.achievement:nth-child(even){background:#fcfcfd}
.check-cell{display:flex;justify-content:center;align-items:center}
.check-cell input{appearance:none;width:22px;height:22px;border:2px solid #aab2bd;border-radius:5px;background:#fff;cursor:pointer;display:grid;place-content:center}
.check-cell.red input{border-color:#b56c73}
.check-cell.blue input{border-color:#6594b6}
.check-cell.red input:checked{background:var(--red);border-color:var(--red)}
.check-cell.blue input:checked{background:var(--blue);border-color:var(--blue)}
.check-cell input:checked:after{content:"✓";color:#fff;font-size:15px;font-weight:900}
.achievement-copy{text-align:center;min-width:0}
.achievement-name{font-size:13px;font-weight:800;color:#28313d}
.achievement-desc{font-size:11px;line-height:1.45;color:#68717e;margin-top:3px}
.points{display:inline-block;margin-top:5px;border:1px solid #d6dce4;border-radius:20px;padding:2px 8px;font-size:9px;font-weight:800;letter-spacing:.08em;color:#4e5a68}
@media(max-width:620px){
 main{width:calc(100% - 20px);margin-top:16px}
 .matchbar{grid-template-columns:1fr;padding:13px}
 .round-control{grid-column:1}
 .teams{gap:9px}
 .team-head{padding:12px 11px 6px;display:block;text-align:center}
 .team-tag{display:none}
 .team-name{font-size:18px}
 .score{font-size:52px}
 .team-foot{padding:9px 10px;font-size:9px}
 .achievement{grid-template-columns:42px 1fr 42px;padding:11px 7px;gap:4px}
 .team-labels{grid-template-columns:42px 1fr 42px;padding:8px 7px}
 .achievement-name{font-size:12px}
 .achievement-desc{font-size:10px}
}
</style>
</head>

<div class="titlebar">TACTICAL MATCH CONTROL</div>
<main>
  <section class="panel matchbar" aria-label="Match controls">
    <div></div>
    <div class="round-control">
      <div class="eyebrow">ROUND</div>
      <div class="round-number" id="round">1</div>
      <div class="stepper"><button id="roundDown" aria-label="Previous round">−</button><button id="roundUp" aria-label="Next round">+</button></div>
    </div>
  </section>
  <section class="teams" aria-label="Team scores">
    <article class="team red">
      <div class="team-head"><div class="team-name">RED TEAM</div></div>
      <div class="score-area"><div class="score" id="redTotal">0</div><div class="vp">VP</div></div>
      <div class="score-stepper"><button id="redDown" aria-label="Subtract one red team VP">−</button><button id="redUp" aria-label="Add one red team VP">+</button></div>
      <div class="team-foot"><span>ACHIEVEMENT VP</span><strong id="redAchievement">0</strong></div>
    </article>
    <article class="team blue">
      <div class="team-head"><div class="team-name">BLUE TEAM</div></div>
      <div class="score-area"><div class="score" id="blueTotal">0</div><div class="vp">VP</div></div>
      <div class="score-stepper"><button id="blueDown" aria-label="Subtract one blue team VP">−</button><button id="blueUp" aria-label="Add one blue team VP">+</button></div>
      <div class="team-foot"><span>ACHIEVEMENT VP</span><strong id="blueAchievement">0</strong></div>
    </article>
  </section>
  <section aria-label="Achievement tracker">
    <h1 class="section-heading">ACHIEVEMENT TRACKER</h1>
    <p class="section-note">Mark achievements as each team earns them. Victory Points are added automatically.</p>
    <div id="achievements"></div>
  </section>
  <div class="reset-area">
    <button class="reset" id="reset" type="button" onclick="resetMatch()">RESET MATCH</button>
  </div>
</main>
<script>
const tiers = [
 {name:"NORMAL",value:1,items:[
  ["Double Kill","Kill two enemy models in the same Round."],
  ["Triple Kill","Kill three enemy models in the same Round."],
  ["Will of the Gods","All models in your Fireteam have been killed in a game."],
  ["All That Juice","Roll five or more Headshots in a single action."],
  ["Wanna have a Catch?","Kill an enemy model with a Weapon Type or Type III Item: Grenade."],
  ["Parade Ready","Play with a fully painted Fireteam."],
  ["Yard Sale","Kill an enemy model equipped with an extra weapon and one or more items."],
  ["Bounty Hunter","Kill an enemy model that has just killed a friendly model immediately after its activation ends, or in your next activation."],
  ["Wall Splat","Force an enemy model to be killed by a wall."]
 ]},
 {name:"HEROIC",value:2,items:[
  ["Off the Rack","Pick up a weapon that spawned this Round and kill an enemy model in the same activation."],
  ["Perfection","Kill an enemy model with exactly the correct number of successes in one action."],
  ["Juggernaut","Survive an Assault action with two or more enemy models in the same cube whilst alone."]
 ]},
 {name:"LEGENDARY",value:3,items:[
  ["Extermination","All enemy models are waiting to Respawn at the end of an activation."]
 ]}
];
const freshState=()=>({round:1,redManual:0,blueManual:0,redDone:[],blueDone:[]});
let state=freshState();
try{const saved=localStorage.getItem("halo-flashpoint-tracker-v1");if(saved)state={...freshState(),...JSON.parse(saved)}}catch(e){}
const $=id=>document.getElementById(id);
function allItems(){return tiers.flatMap(t=>t.items.map(([name,desc])=>({name,desc,value:t.value,tier:t.name})))}
function achievementScore(team){const done=new Set(state[team+"Done"]);return allItems().filter(a=>done.has(a.name)).reduce((s,a)=>s+a.value,0)}
function save(){try{localStorage.setItem("halo-flashpoint-tracker-v1",JSON.stringify(state))}catch(e){}}
function renderScores(){
 const ra=achievementScore("red"),ba=achievementScore("blue"),rt=state.redManual+ra,bt=state.blueManual+ba;
 $("round").textContent=state.round;
 $("redTotal").textContent=rt;$("blueTotal").textContent=bt;
 $("redAchievement").textContent=ra;$("blueAchievement").textContent=ba;
}
function renderAchievements(){
 const root=$("achievements");root.innerHTML="";
 tiers.forEach(tier=>{
  const section=document.createElement("section");section.className="panel tier";
  const title=document.createElement("div");title.className="tier-title";title.textContent=tier.name;
  const sub=document.createElement("span");sub.textContent=`(${tier.value} VP EACH)`;title.appendChild(sub);section.appendChild(title);
  const labels=document.createElement("div");labels.className="team-labels";
  labels.innerHTML='<span class="r">RED</span><span>ACHIEVEMENT</span><span class="b">BLUE</span>';section.appendChild(labels);
  tier.items.forEach(([name,desc])=>{
   const row=document.createElement("div");row.className="achievement";
   const makeCheck=(team,color)=>{
    const cell=document.createElement("label");cell.className=`check-cell ${color}`;
    const input=document.createElement("input");input.type="checkbox";input.checked=state[team+"Done"].includes(name);
    input.setAttribute("aria-label",`${team} team earned ${name}`);
    input.addEventListener("change",()=>{
      const key=team+"Done";
      state[key]=input.checked?[...state[key],name]:state[key].filter(x=>x!==name);
      save();renderScores();
    });
    cell.appendChild(input);return cell;
   };
   const copy=document.createElement("div");copy.className="achievement-copy";
   const heading=document.createElement("div");heading.className="achievement-name";heading.textContent=name;
   const description=document.createElement("div");description.className="achievement-desc";description.textContent=desc;
   const badge=document.createElement("span");badge.className="points";badge.textContent=`${tier.value} VP`;
   copy.append(heading,description,badge);
   row.append(makeCheck("red","red"),copy,makeCheck("blue","blue"));section.appendChild(row);
  });
  root.appendChild(section);
 });
}
function changeScore(team,delta){const key=team+"Manual";state[key]=Math.max(0,state[key]+delta);save();renderScores()}
$("roundDown").addEventListener("click",()=>{state.round=Math.max(1,state.round-1);save();renderScores()});
$("roundUp").addEventListener("click",()=>{state.round++;save();renderScores()});
["red","blue"].forEach(team=>{
 $(team+"Down").addEventListener("click",()=>changeScore(team,-1));
 $(team+"Up").addEventListener("click",()=>changeScore(team,1));
});
function resetMatch(){
  const confirmed = window.confirm("Reset the match? This clears both team scores, all achievements, and returns the round to 1.");
  if (!confirmed) return;
  state = freshState();
  save();
  renderScores();
  renderAchievements();
}
window.resetMatch = resetMatch;
renderScores();
renderAchievements();
</script>
</body>
</html>
